<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="svgTitle svgDesc" xml:space="preserve">
  <style>@media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }</style>
  <title id="svgTitle">Zyvor Stack</title>
  <desc id="svgDesc">Terminal window showing the Zyvor stack: Migrate, Run, Network, Storage, AI/GPU, and Deploy — one platform, one API.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="45%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0583a"/>
      <stop offset="55%" stop-color="#ff8f3f"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0583a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="winShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clipWin"><rect x="40" y="30" width="760" height="400" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="200" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="960" cy="380" r="140" fill="#14b8a6" fill-opacity="0.08" filter="url(#soft)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 92 H1280 M0 184 H1280 M0 276 H1280 M0 368 H1280"/>
    <path d="M160 0 V460 M320 0 V460 M480 0 V460 M640 0 V460 M800 0 V460 M960 0 V460 M1120 0 V460"/>
  </g>

  <!-- brand lockup, right of terminal -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial">
    <rect x="860" y="140" width="56" height="56" rx="14" fill="url(#accent)"/>
    <text x="888" y="178" text-anchor="middle" font-size="28" font-weight="800" fill="#0c1222">Z</text>
    <text x="936" y="170" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-1">zyvor</text>
    <text x="936" y="196" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2.5">INFRASTRUCTURE SOFTWARE</text>
    <text x="860" y="250" font-size="17" fill="#cbd5e1">Leave lock-in.</text>
    <text x="860" y="278" font-size="17" fill="#cbd5e1">One platform, one API,</text>
    <text x="860" y="306" font-size="17" fill="#cbd5e1">one operating model.</text>
  </g>

  <!-- terminal window -->
  <g filter="url(#winShadow)">
    <rect x="40" y="30" width="760" height="400" rx="16" fill="#090d13" stroke="#263341" stroke-width="2"/>
    <g clip-path="url(#clipWin)">
      <rect x="40" y="30" width="760" height="42" fill="#0b1017"/>
    </g>
    <line x1="40" y1="72" x2="800" y2="72" stroke="#202a36"/>

    <circle cx="64" cy="51" r="5" fill="#ff625a"/>
    <circle cx="82" cy="51" r="5" fill="#ffbd44"/>
    <circle cx="100" cy="51" r="5" fill="#00ca4e"/>
    <text x="420" y="56" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8f9ba9">Zyvor Stack</text>
  </g>

  <!-- body -->
  <g font-family="'Courier New', Courier, monospace">
    <text x="80" y="112" font-size="14"><tspan fill="#7ef29a">&#10095; </tspan><tspan fill="#dfe7ef">zyvor@infra:~$ </tspan><tspan fill="#9aa6b3">stack</tspan></text>
    <text x="80" y="146" font-size="14" font-weight="700" fill="url(#accent)">ZYVOR STACK · ONE API FABRIC</text>

    <text x="80" y="180" font-size="13" fill="#f7f9fb" font-weight="700">MIGRATE</text><text x="184" y="180" font-size="13" fill="#94a3b8">HyperSDK &#183; hyper2kvm &#183; GuestKit</text>
    <text x="80" y="210" font-size="13" fill="#f7f9fb" font-weight="700">RUN</text><text x="184" y="210" font-size="13" fill="#94a3b8">Zeus OS &#183; Veyron &#183; Machina &#183; Fabric</text>
    <text x="80" y="240" font-size="13" fill="#f7f9fb" font-weight="700">NETWORK</text><text x="184" y="240" font-size="13" fill="#94a3b8">PacketWolf &#183; Cilium &#183; eBPF &#183; Hubble</text>
    <text x="80" y="270" font-size="13" fill="#f7f9fb" font-weight="700">STORAGE</text><text x="184" y="270" font-size="13" fill="#94a3b8">Atlas &#183; Ceph &#183; NFS &#183; ZFS</text>
    <text x="80" y="300" font-size="13" fill="#f7f9fb" font-weight="700">AI / GPU</text><text x="184" y="300" font-size="13" fill="#94a3b8">Forge &#183; Ragnarok &#183; IronWolf</text>
    <text x="80" y="330" font-size="13" fill="#f7f9fb" font-weight="700">DEPLOY</text><text x="184" y="330" font-size="13" fill="#94a3b8">HyperCluster &#183; Aether &#183; Kubernetes</text>

    <text x="80" y="368" font-size="14" fill="#7ef29a">&#10003; one platform &#183; one API &#183; one operating model</text>

    <text x="80" y="404" font-size="16" fill="#7ef29a">&#10095;</text>
    <rect x="102" y="391" width="10" height="19" fill="#7ef29a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="80" y="444" width="220" height="4" rx="2" fill="url(#accent)"/>
</svg>
